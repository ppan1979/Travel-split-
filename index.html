<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sicilia 2026 - Final Vibe</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --terra:#C4622D;--terraD:#9E4B1F;--sand:#EAD8B5;--sandL:#F5EDDA;
  --cream:#FAF5EC;--dark:#2E1A0E;--olive:#6B7E4A;--sea:#3D7A8A;
  --white:#FFFFFF;--muted:#8E8271;--border:#E8E2D9;
  --serif:'Cormorant Garamond',serif;--sans:'DM Sans',sans-serif;
  --shadow:0 4px 12px rgba(46,26,14,0.05);
}
body{font-family:var(--sans);background:var(--cream);min-height:100vh;max-width:430px;margin:0 auto;color:var(--dark);padding-bottom:100px;-webkit-font-smoothing:antialiased}
.map-banner{width:100%;height:180px;position:relative;overflow:hidden;background:var(--terraD)}
.map-img{width:100%;height:100%;object-fit:cover;filter:saturate(.8) brightness(.85)}
.map-overlay{position:absolute;inset:0;background:linear-gradient(to bottom, rgba(46,26,14,0) 0%, rgba(46,26,14,0.6) 100%)}
.map-label{position:absolute;bottom:20px;left:20px;right:20px}
.map-title{font-family:var(--serif);font-weight:600;color:var(--white);font-size:32px;line-height:1}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,0.95);backdrop-filter:blur(10px);border-top:1px solid var(--border);display:flex;padding:10px 0 24px;z-index:50}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:600}
.nav-btn.active{color:var(--terra)}
.fab{position:fixed;bottom:90px;right:20px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(--terra),var(--terraD));color:var(--white);font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(196,98,45,0.4);border:none;z-index:40}
.body{padding:20px 18px}
.s-label{font-family:var(--serif);font-weight:600;font-size:20px;margin:12px 0 16px;display:flex;justify-content:space-between;align-items:center}
.s-action{font-size:12px;color:var(--sea);cursor:pointer;background:var(--sandL);padding:6px 12px;border-radius:20px;font-weight:700}
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border-radius:12px;padding:8px 16px;font-size:13px;border:1px solid var(--border);background:var(--white);font-weight:500;cursor:pointer}
.chip.on{background:var(--terra);color:var(--white);border-color:var(--terra)}
.card{background:var(--white);border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(--shadow);display:flex;gap:14px;align-items:center;position:relative}
.card-del-btn{background:#e74c3c;color:white;border:none;border-radius:8px;padding:6px 10px;font-size:11px;position:absolute;top:12px;right:12px;display:none}
.card.editing .card-del-btn{display:block}
.overlay{position:fixed;inset:0;background:rgba(46,26,14,0.6);backdrop-filter:blur(4px);z-index:60;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity 0.3s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(--cream);border-radius:24px 24px 0 0;padding:24px 20px 40px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform 0.4s cubic-bezier(.4,0,.2,1)}
.overlay.show .sheet{transform:translateY(0)}

/* 圖4 專屬類別網格 */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.cat-btn{padding:12px 8px;border-radius:16px;cursor:pointer;font-size:12px;border:1px solid var(–border);background:var(–white);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(–dark);transition:0.2s}
.cat-btn.on{background:var(–terra);color:var(–white);border-color:var(–terra)}
.cat-emoji{font-size:24px;margin-bottom:4px}

.f-label{font-size:11px;color:var(–muted);font-weight:700;margin:15px 0 8px;display:block;text-transform:uppercase}
.f-input{width:100%;padding:14px;border-radius:12px;border:1px solid var(–border);margin-bottom:15px;font-size:16px;background:white;outline:none}
.sub-btn{width:100%;padding:16px;border-radius:16px;background:var(–terra);color:white;border:none;font-weight:700;font-size:16px;margin-top:20px;box-shadow:0 4px 12px rgba(196,98,45,0.2)}
.screen{display:none}.screen.active{display:block}
.cur-tag{display:inline-block;padding:2px 8px;border-radius:6px;background:var(–dark);color:white;font-size:11px;margin-bottom:10px;font-weight:700}
.bal-card{background:var(–white);border-radius:16px;padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
</style>

</head>
<body>

<div id="loading-screen" style="position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:15px">
  <div style="font-size:50px">🌋</div>
  <div style="font-family:var(--serif);font-style:italic;color:var(--terra)">Syncing Ledger...</div>
</div>

<div class="map-banner">
  <img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?q=80&w=1200" class="map-img"/>
  <div class="map-overlay"></div>
  <div class="map-label">
    <div style="font-family:var(--serif);font-style:italic;color:white;opacity:0.8;font-size:12px">Travel Ledger 2026</div>
    <div class="map-title">Sicilia 🌊</div>
  </div>
</div>

<div id="screen-home" class="screen active body">
  <div class="s-label">旅伴與明細 <span class="s-action" onclick="window.toggleEdit()">🔒 管理</span></div>
  <div class="chip-wrap" id="member-chips"></div>
  <div id="expense-list"></div>
</div>

<div id="screen-summary" class="screen body"><div id="summary-content"></div></div>

<div id="screen-settings" class="screen body">
  <div class="s-label">帳本設定</div>
  <button class="sub-btn" style="background:var(--sea);margin-top:0" onclick="window.exportToCSV()">📊 匯出 CSV 報表</button>
  <div class="s-label" style="margin-top:30px">幣別管理</div>
  <div id="setting-cur-list" class="chip-wrap"></div>
  <button class="chip" style="width:100%" onclick="window.addCur()">+ 新增幣別</button>
</div>

<div class="overlay" id="add-overlay" onclick="if(event.target.id==='add-overlay')window.closeSheet()">
  <div class="sheet">
    <div style="text-align:center;font-weight:700;font-size:18px;margin-bottom:20px">新增支出</div>

```
<label class="f-label">類別</label>
<div class="cat-grid" id="f-cat-grid"></div>

<label class="f-label">誰墊付</label>

  </div>
</div>

<button class="fab" onclick="window.openSheet()">+</button>

<div class="nav">
  <button class="nav-btn active" id="nav-home" onclick="window.go('home')">🧾 明細</button>
  <button class="nav-btn" id="nav-summary" onclick="window.go('summary')">⚖️ 結算</button>
  <button class="nav-btn" id="nav-settings" onclick="window.go('settings')">⚙️ 設定</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, remove, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const _K = "1979", _R = "sicilia2026";
const config = { apiKey: "AIzaSyBF5DMs4bTOC-8IvN0LthZGSkLVWhA25sY", authDomain: "travel-sync-57594.firebaseapp.com", databaseURL: "https://travel-sync-57594-default-rtdb.firebaseio.com", projectId: "travel-sync-57594", appId: "1:1025511821264:web:9fde66b9a08400fd6f33d5" };

const app = initializeApp(config);
const db = getDatabase(app);
const expRef = ref(db, _R + "/expenses"), memRef = ref(db, _R + "/members"), curRef = ref(db, _R + "/currencies");

// 完全還原圖4分類
const CATS = [
    {id:"car",emoji:"🚗",n:"租車/油費"},
    {id:"food",emoji:"🍝",n:"餐飲"},
    {id:"hotel",emoji:"🏨",n:"住宿"},
    {id:"ticket",emoji:"🎟",n:"門票"},
    {id:"shop",emoji:"🛍",n:"購物"},
    {id:"other",emoji:"📌",n:"其他"}
];

let expenses = {}, members = ["Pauline", "Daniel"], currencies = ["EUR", "TWD"], isEditing = false, editKey = null;
let fCur="EUR", fPayer="Pauline", fCat="food", fSplits=["Pauline", "Daniel"];

window.go = n => {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
  document.getElementById('screen-' + n).classList.add('active');
  document.getElementById('nav-' + n).classList.add('active');
  if(n === 'summary') renderSummary();
};

window.toggleEdit = () => {
  if(!isEditing && prompt("Verification:") !== _K) return;
  isEditing = !isEditing;
  renderAll();
};

window.openSheet = (key = null) => {
  editKey = key;
  if(key) {
    const e = expenses[key];
    document.getElementById("f-desc").value = e.desc;
    document.getElementById("f-amt").value = e.amount;
    fCur = e.currency; fPayer = e.paidBy; fCat = e.category; fSplits = e.splits;
  } else {
    document.getElementById("f-desc").value = "";
    document.getElementById("f-amt").value = "";
    fCur = currencies[0]; fPayer = members[0]; fCat = "car"; fSplits = [...members];
  }
  renderSheetUI();
  document.getElementById("add-overlay").classList.add("show");
};

window.closeSheet = () => document.getElementById("add-overlay").classList.remove("show");

window.submitExpense = () => {
  const desc = document.getElementById("f-desc").value, amt = parseFloat(document.getElementById("f-amt").value);
  if(!desc || isNaN(amt) || fSplits.length === 0) return alert("Please fill all fields");
  const data = { desc, amount: amt, currency: fCur, paidBy: fPayer, category: fCat, splits: fSplits, ts: editKey ? expenses[editKey].ts : Date.now() };
  if(editKey) update(ref(db, _R + "/expenses/" + editKey), data).then(window.closeSheet);
  else push(expRef, data).then(window.closeSheet);
};

function renderSheetUI() {
  document.getElementById("f-cur-chips").innerHTML = currencies.map(c => `<div class="chip ${fCur===c?'on':''}" onclick="window.setFCur('${c}')">${c}</div>`).join("");
  document.getElementById("f-payer-chips").innerHTML = members.map(m => `<div class="chip ${fPayer===m?'on':''}" onclick="window.setFPayer('${m}')">${m}</div>`).join("");
  document.getElementById("f-split-chips").innerHTML = members.map(m => `<div class="chip ${fSplits.includes(m)?'on':''}" onclick="window.toggleSplit('${m}')">${m}</div>`).join("");
  document.getElementById("f-cat-grid").innerHTML = CATS.map(c => `<div class="cat-btn ${fCat===c.id?'on':''}" onclick="window.setFCat('${c.id}')"><div class="cat-emoji">${c.emoji}</div>${c.n}</div>`).join("");
}

window.setFCur = c => { fCur=c; renderSheetUI(); };
window.setFPayer = m => { fPayer=m; renderSheetUI(); };
window.setFCat = id => { fCat=id; renderSheetUI(); };
window.toggleSplit = m => { fSplits = fSplits.includes(m) ? fSplits.filter(x=>x!==m) : [...fSplits, m]; renderSheetUI(); };

function renderAll() {
  const memArea = document.getElementById("member-chips");
  if(memArea) memArea.innerHTML = members.map(m => `<div class="chip on">${m}${isEditing?`<span onclick="window.delMem('${m}')"> ×</span>`:''}</div>`).join("") + (isEditing?`<div class="chip" onclick="window.addMem()">+ 新旅伴</div>`:'');
  
  const list = Object.entries(expenses).sort((a,b)=>b[1].ts - a[1].ts);
  const el = document.getElementById("expense-list");
  if(el) el.innerHTML = list.map(([k,e]) => {
    const c = CATS.find(x=>x.id===e.category)||CATS[5];
    return `<div class="card ${isEditing?'editing':''}" onclick="${isEditing?`window.openSheet('${k}')`:''}">
      <div style="font-size:24px">${c.emoji}</div>
      <div style="flex:1">
        <div style="font-weight:700">${e.desc}</div>
        <div style="font-size:11px;color:var(--muted)">${e.paidBy} 墊 · ${e.splits.length}人分</div>
        <div style="color:var(--terra);font-weight:700;margin-top:4px">${e.currency} ${e.amount.toLocaleString()}</div>
      </div>
      ${isEditing?`<button class="card-del-btn" onclick="event.stopPropagation();window.delExp('${k}')">刪除</button>`:''}
    </div>`;
  }).join("") || "<div style='text-align:center;padding:40px;color:#aaa'>No Data</div>";
  
  const setCur = document.getElementById("setting-cur-list");
  if(setCur) setCur.innerHTML = currencies.map(c => `<div class="chip on">${c}<span onclick="window.delCur('${c}')"> ×</span></div>`).join("");
}

function renderSummary() {
  const cont = document.getElementById("summary-content"); 
  cont.innerHTML = "<div class='s-label'>各幣別結算</div>";
  currencies.forEach(curId => {
    const list = Object.values(expenses).filter(e => e.currency === curId); if(!list.length) return;
    const paid={}, owed={}; members.forEach(m => { paid[m]=0; owed[m]=0; });
    list.forEach(e => {
      paid[e.paidBy] += e.amount;
      const per = e.amount / e.splits.length;
      e.splits.forEach(s => owed[s] += per);
    });
    let html = `<div class="currency-section" style="margin-bottom:24px"><div class="cur-tag">${curId} 結算</div>`;
    members.forEach(m => {
      const diff = paid[m] - owed[m];
      html += `<div class="bal-card"><div>${m}</div><div style="text-align:right"><div style="font-weight:700;color:${diff>=0?'var(--olive)':'var(--terra)'}">${diff>=0?'+':''}${diff.toFixed(2)}</div><div style="font-size:10px;color:var(--muted)">付 ${paid[m].toFixed(2)} / 應 ${owed[m].toFixed(2)}</div></div></div>`;
    });
    cont.innerHTML += html + "</div>";
  });
}

window.addMem = () => { const n = prompt("Name?"); if(n) { members.push(n); set(memRef, members); }};
window.delMem = m => confirm("Delete member?") && (members=members.filter(x=>x!==m), set(memRef, members));
window.delExp = k => confirm("Delete expense?") && remove(ref(db, _R+"/expenses/"+k));
window.addCur = () => { const c = prompt("Currency (e.g. EUR)?")?.toUpperCase(); if(c) { currencies.push(c); set(curRef, currencies); }};
window.delCur = c => confirm("Delete currency?") && (currencies=currencies.filter(x=>x!==c), set(curRef, currencies));

window.exportToCSV = () => {
  const list = Object.values(expenses).sort((a,b) => a.ts - b.ts);
  let csv = "\uFEFFDate,Desc,Cat,Amt,Cur,Payer," + members.join(",") + "\n";
  list.forEach(e => {
    const per = e.amount / e.splits.length;
    let row = [new Date(e.ts).toLocaleDateString(), e.desc, e.category, e.amount, e.currency, e.paidBy];
    members.forEach(m => row.push(e.splits.includes(m) ? per.toFixed(2) : 0));
    csv += row.join(",") + "\n";
  });
  const link = document.createElement("a");
  link.href = URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" }));
  link.download = `Sicilia_Report.csv`; link.click();
};

onValue(expRef, s => { expenses=s.val()||{}; renderAll(); document.getElementById("loading-screen").style.display="none"; });
onValue(memRef, s => { if(s.val()) members=s.val(); renderAll(); });
onValue(curRef, s => { if(s.val()) currencies=s.val(); renderAll(); });

// 保底：8秒後強制隱藏 loading，避免 Firebase 連線慢時永遠卡著
setTimeout(() => {
  const ls = document.getElementById("loading-screen");
  if(ls) ls.style.display = "none";
}, 8000);
</script>

</body>
</html>
