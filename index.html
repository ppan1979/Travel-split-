<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sicilia 2026 🌊</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --terra:#C4622D;--terraD:#9E4B1F;--sand:#EAD8B5;--sandL:#F5EDDA;
  --cream:#FAF5EC;--dark:#2E1A0E;--olive:#6B7E4A;--sea:#3D7A8A;
  --muted:#8E8271;--border:#E8E2D9;
  --serif:'Cormorant Garamond',serif;--sans:'DM Sans',sans-serif;
  --shadow:0 4px 12px rgba(46,26,14,0.07);
}
body{font-family:var(--sans);background:var(--cream);min-height:100vh;max-width:430px;margin:0 auto;color:var(--dark);padding-bottom:100px;-webkit-font-smoothing:antialiased}

/* ── Map banner — pure CSS, no external image ── */
.map-banner{width:100%;height:200px;position:relative;overflow:hidden}
.map-banner-bg{
position:absolute;inset:0;
background:linear-gradient(160deg,#D4733D 0%,#B85A24 35%,#8B3D10 70%,#6B2D08 100%);
}
.map-banner-pattern{
position:absolute;inset:0;
background-image:
radial-gradient(circle at 15% 25%,rgba(255,255,255,.12) 0%,transparent 35%),
radial-gradient(circle at 85% 15%,rgba(255,220,180,.15) 0%,transparent 40%),
radial-gradient(circle at 50% 80%,rgba(0,0,0,.15) 0%,transparent 50%),
radial-gradient(circle at 20% 50%,rgba(255,255,255,.06) 1px,transparent 1px),
radial-gradient(circle at 70% 30%,rgba(255,255,255,.06) 1px,transparent 1px),
radial-gradient(circle at 40% 70%,rgba(255,255,255,.06) 1px,transparent 1px),
radial-gradient(circle at 90% 60%,rgba(255,255,255,.06) 1px,transparent 1px);
background-size:100% 100%,100% 100%,100% 100%,50px 50px,70px 70px,40px 40px,60px 60px;
}
.map-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,transparent 30%,rgba(46,26,14,.5) 100%)}
.map-label{position:absolute;bottom:20px;left:22px;right:22px}
.map-eyebrow{font-family:var(–serif);font-style:italic;color:rgba(255,255,255,.85);font-size:13px;letter-spacing:4px;text-transform:uppercase;margin-bottom:6px}
.map-title{font-family:var(–serif);font-weight:600;color:#fff;font-size:38px;line-height:1;text-shadow:0 2px 14px rgba(0,0,0,.4)}

/* ── Stats bar ── */
.stats-bar{background:var(–cream);padding:16px 18px;display:flex;gap:0;border-bottom:1px solid var(–border)}
.stat-item{flex:1;text-align:center}
.stat-val{font-size:18px;font-weight:700;color:var(–dark)}
.stat-lbl{font-size:10px;color:var(–muted);letter-spacing:.5px;margin-top:2px;text-transform:uppercase}
.stat-divider{width:1px;background:var(–border);margin:4px 0}

/* ── Nav ── */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(250,245,236,.96);backdrop-filter:blur(12px);border-top:1px solid var(–border);display:flex;padding:10px 0 20px;z-index:50}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-family:var(–sans);font-size:11px;font-weight:500;color:var(–muted);transition:color .2s}
.nav-btn.active{color:var(–terra);font-weight:700}
.nav-icon{font-size:22px}

/* ── FAB ── */
.fab{position:fixed;bottom:86px;right:18px;width:56px;height:56px;border-radius:50%;background:#C4622D;color:#fff;font-size:28px;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(196,98,45,.6);cursor:pointer;border:none;z-index:40}

/* ── Body ── */
.body{padding:18px 16px}
.s-label{font-family:var(–serif);font-weight:600;font-size:20px;color:var(–dark);margin:8px 0 14px;display:flex;justify-content:space-between;align-items:center}
.s-action{font-family:var(–sans);font-size:12px;color:var(–sea);cursor:pointer;font-weight:700;background:var(–sandL);padding:5px 12px;border-radius:20px}

/* ── Chips — strong terra color ── */
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border-radius:20px;padding:8px 18px;font-size:13px;cursor:pointer;border:2px solid;transition:all .15s;font-family:var(–sans);font-weight:700;background:none}
.chip.on{background:#C4622D;color:#fff;border-color:#C4622D;box-shadow:0 3px 10px rgba(196,98,45,.4)}
.chip.off{background:#fff;color:#2E1A0E;border-color:#C8B99A;font-weight:600}

/* ── Expense cards ── */
.card{background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(–shadow);display:flex;gap:14px;align-items:center}
.card.editing{border:1.5px dashed var(–terra);cursor:pointer}
.card-icon{width:42px;height:42px;border-radius:12px;background:var(–sandL);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.card-del-btn{background:#e74c3c;color:#fff;border:none;border-radius:8px;padding:6px 12px;font-size:12px;font-weight:700;display:none;cursor:pointer;flex-shrink:0}
.card.editing .card-del-btn{display:block}

/* ── Splid summary ── */
.splid-wrap{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(–shadow);margin-bottom:18px}
.splid-title{font-family:var(–serif);font-size:16px;font-weight:600;color:var(–dark);padding:14px 16px 8px;border-bottom:1px solid var(–sandL)}
.splid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.splid-table{width:100%;border-collapse:collapse;font-size:12px;min-width:280px}
.splid-table th{background:var(–sandL);color:var(–muted);font-weight:700;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:8px 12px;text-align:right;white-space:nowrap}
.splid-table th:first-child{text-align:left}
.splid-table td{padding:10px 12px;border-bottom:1px solid var(–sandL);vertical-align:middle;text-align:right}
.splid-table td:first-child{text-align:left}
.splid-table tr:last-child td{border-bottom:none}
.row-title{font-weight:600;color:var(–dark);font-size:12px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-by{font-size:10px;color:var(–muted);margin-top:2px}
.amt-paid{color:var(–olive);font-weight:700}
.amt-owed{color:var(–terra);font-weight:600}
.total-row td{font-weight:700;font-size:13px;background:var(–sandL)}
.payment-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(–shadow);display:flex;align-items:center;gap:10px}
.settled-box{text-align:center;padding:28px;color:var(–muted);font-size:14px}

/* ── Sheet ── */
.overlay{position:fixed;inset:0;background:rgba(46,26,14,.6);backdrop-filter:blur(4px);z-index:60;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(–cream);border-radius:24px 24px 0 0;padding:24px 18px 44px;max-height:92vh;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.overlay.show .sheet{transform:translateY(0)}
.sheet-title-text{text-align:center;font-family:var(–serif);font-size:22px;font-weight:600;margin-bottom:20px;color:var(–dark)}
.f-label{font-size:11px;color:var(–muted);letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px;display:block;font-weight:700}
.f-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(–border);background:#fff;font-size:16px;outline:none;font-family:var(–sans);transition:border-color .2s;color:var(–dark)}
.f-input:focus{border-color:#C4622D}
.sub-btn{width:100%;padding:16px;border-radius:16px;background:#C4622D;color:#fff;font-weight:700;border:none;margin-top:20px;cursor:pointer;font-family:var(–serif);font-style:italic;font-size:19px;letter-spacing:.5px;box-shadow:0 5px 18px rgba(196,98,45,.55)}
.cancel-btn{width:100%;padding:12px;border-radius:16px;background:transparent;color:#8E8271;font-size:14px;border:1.5px solid #C8B99A;cursor:pointer;margin-top:8px;font-family:var(–sans);font-weight:600}

/* ── Category grid — KEY: use inline styles via JS, not CSS selectors ── */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.cat-btn{
padding:18px 6px 12px;border-radius:16px;cursor:pointer;
display:flex;flex-direction:column;align-items:center;gap:7px;
transition:all .2s;font-family:var(–sans);font-weight:600;font-size:12.5px;
border:none;
}

/* ── Currency chips in settings ── */
.cur-chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.cur-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(–border);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.cur-chip-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0;line-height:1}
.cur-add-row{display:flex;gap:8px}
.cur-add-row input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(–border);font-size:14px;outline:none;background:#fff;font-family:var(–sans)}
.cur-add-btn{padding:10px 16px;border-radius:12px;background:var(–sea);color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer}

.screen{display:none}.screen.active{display:block}
.info-box{background:#fff;border-radius:14px;padding:16px;box-shadow:var(–shadow);margin-bottom:14px;font-size:13px;color:var(–muted);line-height:1.7}
</style>

</head>
<body>

<!-- Loading -->

<div id="loading-screen" style="position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:14px">
  <div style="font-size:48px;animation:bob 1.4s ease-in-out infinite">🌋</div>
  <div style="font-family:var(--serif);font-style:italic;font-size:18px;color:var(--terra)">Syncing Ledger...</div>
  <style>@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}</style>
</div>

<!-- Map banner — gradient fallback if image fails -->

<div class="map-banner">
  <div class="map-banner-bg"></div>
  <div class="map-banner-pattern"></div>
  <div class="map-overlay"></div>
  <div class="map-label">
    <div class="map-eyebrow">🌊 Travel Ledger 2026</div>
    <div class="map-title">Sicilia</div>
  </div>
</div>

<!-- Stats bar -->

<div class="stats-bar">
  <div class="stat-item"><div class="stat-val" id="s-total">€0.00</div><div class="stat-lbl">總支出</div></div>
  <div class="stat-divider"></div>
  <div class="stat-item"><div class="stat-val" id="s-mem">—</div><div class="stat-lbl">旅伴</div></div>
  <div class="stat-divider"></div>
  <div class="stat-item"><div class="stat-val" id="s-avg">€0.00</div><div class="stat-lbl">均攤</div></div>
</div>

<!-- HOME -->

<div id="screen-home" class="screen active body">
  <div class="s-label">旅伴
    <span class="s-action" id="edit-toggle-btn" onclick="window.handleEditToggle()">
      <span id="lock-icon">🔒</span> <span id="btn-text">編輯管理</span>
    </span>
  </div>
  <div class="chip-wrap" id="member-chips"></div>
  <div class="s-label">支出明細</div>
  <div id="expense-list"></div>
</div>

<!-- SUMMARY -->

<div id="screen-summary" class="screen body">
  <div id="summary-content"></div>
</div>

<!-- SETTINGS -->

<div id="screen-settings" class="screen body">
  <div class="s-label">幣別管理</div>
  <div class="info-box" style="padding-bottom:14px">
    <div style="margin-bottom:12px;font-size:12px">目前支援幣別（EUR 不可刪除）</div>
    <div class="cur-chip-wrap" id="cur-manage-chips"></div>
    <div class="cur-add-row">
      <input type="text" id="new-cur-input" placeholder="輸入幣別代碼，如 JPY" maxlength="5" style="text-transform:uppercase"/>
      <button class="cur-add-btn" onclick="window.addCurrency()">+ 新增</button>
    </div>
  </div>
  <div class="s-label">帳本設定</div>
  <div class="info-box">密碼保護已啟動。進入編輯模式可修正金額或類別。<br>上次更新：<span id="last-sync">—</span></div>
  <button class="sub-btn" style="font-style:normal;font-family:var(--sans);font-size:15px;margin-top:0" onclick="window.exportToCSV()">📊 匯出 CSV 報表</button>
</div>

<!-- ADD/EDIT SHEET -->

<div class="overlay" id="add-overlay" onclick="if(event.target.id==='add-overlay')window.closeSheet()">
  <div class="sheet">
    <div class="sheet-title-text" id="sheet-title">記一筆支出</div>
    <div class="cat-grid" id="cat-grid"></div>
    <label class="f-label">支出說明</label>
    <input type="text" id="f-desc" class="f-input" placeholder="例：阿格里真托神殿門票"/>
    <label class="f-label">金額</label>
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:4px">
      <div class="chip-wrap" id="currency-chips" style="margin-bottom:0;flex-wrap:nowrap;gap:6px"></div>
      <input type="number" id="f-amt" class="f-input" inputmode="decimal" placeholder="0.00" style="flex:1;margin-bottom:0"/>
    </div>
    <label class="f-label">誰墊付</label>
    <div class="chip-wrap" id="payer-chips"></div>
    <label class="f-label">分擔人員（可複選）</label>
    <div class="chip-wrap" id="split-chips"></div>
    <button class="sub-btn" onclick="window.submitExpense()">儲存支出</button>
    <button class="cancel-btn" onclick="window.closeSheet()">取消</button>
  </div>
</div>

<button class="fab" onclick="window.openSheet()">+</button>

<div class="nav">
  <button class="nav-btn active" id="nav-home" onclick="window.go('home')"><span class="nav-icon">🧾</span>明細</button>
  <button class="nav-btn" id="nav-summary" onclick="window.go('summary')"><span class="nav-icon">⚖️</span>結算</button>
  <button class="nav-btn" id="nav-settings" onclick="window.go('settings')"><span class="nav-icon">⚙️</span>設定</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, remove, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const _K=[1,9,7,9], _R="sicilia2026";
const app=initializeApp({apiKey:"AIzaSyBF5DMs4bTOC-8IvN0LthZGSkLVWhA25sY",authDomain:"travel-sync-57594.firebaseapp.com",databaseURL:"https://travel-sync-57594-default-rtdb.firebaseio.com",projectId:"travel-sync-57594",storageBucket:"travel-sync-57594.firebasestorage.app",messagingSenderId:"1025511821264",appId:"1:1025511821264:web:9fde66b9a08400fd6f33d5"});
const db=getDatabase(app);
const expRef=ref(db,_R+"/expenses"), memRef=ref(db,_R+"/members"), curRef=ref(db,_R+"/currencies");

const CATS=[
  {id:"food", label:"餐飲", emoji:"🍝"},
  {id:"car",  label:"交通", emoji:"🚗"},
  {id:"hotel",label:"住宿", emoji:"🏨"},
  {id:"ticket",label:"景點",emoji:"🎟"},
  {id:"shop", label:"購物", emoji:"🛍"},
  {id:"other",label:"其他", emoji:"📌"}
];
const CUR_SYMBOLS={"EUR":"€","TWD":"NT$","USD":"$","HKD":"HK$","JPY":"¥","GBP":"£","AUD":"A$","SGD":"S$","CHF":"Fr","KRW":"₩"};

let CURRENCIES={"EUR":"€","HKD":"HK$"};
let expenses={}, members=["Pauline","Daniel"], isEditing=false, currentEditKey=null;
let fCat="food", fPayer="", fSplits={}, fCur="EUR";

const TERRA="#C4622D";
const fmt=(n,id)=>{const s=CURRENCIES[id]||id||"€";return(n<0?"-":"")+s+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});};

// ── Render cat buttons using inline style — 100% reliable ──
function buildCatGrid(){
  document.getElementById("cat-grid").innerHTML=CATS.map(c=>{
    const on=c.id===fCat;
    const bg=on?TERRA:"#ffffff";
    const col=on?"#ffffff":var_dark();
    const border=on?`2px solid ${TERRA}`:"2px solid #E8E2D9";
    const shadow=on?"0 4px 14px rgba(196,98,45,.4)":"0 2px 8px rgba(46,26,14,.06)";
    return `<button class="cat-btn" data-id="${c.id}" onclick="window.pickCat('${c.id}')"
      style="background:${bg};color:${col};border:${border};box-shadow:${shadow}">
      <span style="font-size:34px;line-height:1">${c.emoji}</span>
      <span style="font-size:12.5px;font-weight:600">${c.label}</span>
    </button>`;
  }).join("");
}
function var_dark(){return "#2E1A0E";}

window.pickCat=id=>{
  fCat=id;
  document.querySelectorAll(".cat-btn").forEach(b=>{
    const on=b.dataset.id===id;
    b.style.background=on?TERRA:"#ffffff";
    b.style.color=on?"#ffffff":"#2E1A0E";
    b.style.border=on?`2px solid ${TERRA}`:"2px solid #E8E2D9";
    b.style.boxShadow=on?"0 4px 14px rgba(196,98,45,.4)":"0 2px 8px rgba(46,26,14,.06)";
  });
};

function renderAll(){
  renderMembers(); renderExpenses();
  const eur=Object.values(expenses).filter(e=>e.currency==="EUR").reduce((s,e)=>s+(e.amount||0),0);
  document.getElementById("s-total").textContent=fmt(eur,"EUR");
  document.getElementById("s-mem").textContent=members.length;
  document.getElementById("s-avg").textContent=fmt(members.length?eur/members.length:0,"EUR");
  if(document.getElementById("screen-summary").classList.contains("active")) renderSummary();
}

function renderMembers(){
  const w=document.getElementById("member-chips");
  w.innerHTML=members.map(m=>`<div class="chip on">${m}${isEditing?`<span onclick="window.delMem('${m}')" style="margin-left:8px;opacity:.6;cursor:pointer;font-size:15px">×</span>`:""}</div>`).join("");
  if(isEditing) w.innerHTML+=`<button class="chip off" onclick="window.addMem()">+ 新旅伴</button>`;
}

function renderExpenses(){
  const el=document.getElementById("expense-list");
  const list=Object.entries(expenses).sort((a,b)=>(b[1].ts||0)-(a[1].ts||0));
  if(!list.length){el.innerHTML=`<div style="text-align:center;padding:40px 0;color:#bbb"><div style="font-size:40px;margin-bottom:10px">🍋</div>尚無支出明細</div>`;return;}
  el.innerHTML=list.map(([k,e])=>{
    const c=CATS.find(x=>x.id===e.category)||CATS[5];
    const per=(e.amount||0)/Math.max((e.splits||[]).length,1);
    return `<div class="card ${isEditing?"editing":""}" onclick="window.handleCardClick('${k}')">
      <div class="card-icon">${c.emoji}</div>
      <div style="flex:1;min-width:0">
        <div style="font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${e.desc||""}</div>
        <div style="font-size:11px;color:var(--muted);margin-top:2px">${e.paidBy||""} 墊付 · ${(e.splits||[]).join("、")} 分擔</div>
        <div style="font-size:11px;color:var(--muted)">${c.label}</div>
        <div style="color:var(--terra);font-weight:700;margin-top:4px;font-size:15px">${fmt(e.amount||0,e.currency)} <span style="font-size:11px;font-weight:400;color:var(--muted)">每人 ${fmt(per,e.currency)}</span></div>
      </div>
      <button class="card-del-btn" onclick="event.stopPropagation();window.delExp('${k}')">刪除</button>
    </div>`;
  }).join("");
}

function renderSummary(){
  const c=document.getElementById("summary-content");
  let html="";
  Object.entries(CURRENCIES).forEach(([curId])=>{
    const list=Object.values(expenses).filter(e=>e.currency===curId);
    if(!list.length) return;
    const paid={},owed={};
    members.forEach(m=>{paid[m]=0;owed[m]=0;});
    list.forEach(e=>{
      if(paid[e.paidBy]!==undefined) paid[e.paidBy]+=(e.amount||0);
      (e.splits||[]).forEach(m=>{if(owed[m]!==undefined) owed[m]+=(e.amount||0)/Math.max((e.splits||[]).length,1);});
    });
    const net={};members.forEach(m=>net[m]=(paid[m]||0)-(owed[m]||0));
    const total=list.reduce((s,e)=>s+(e.amount||0),0);
    const thCols=members.map(m=>`<th>${m}</th>`).join("");
    const rows=list.sort((a,b)=>(a.ts||0)-(b.ts||0)).map(e=>{
      const cat=CATS.find(x=>x.id===e.category)||CATS[5];
      const per=(e.amount||0)/Math.max((e.splits||[]).length,1);
      const ds=e.ts?new Date(e.ts).toLocaleDateString("zh-TW",{month:"numeric",day:"numeric"}):"";
      const cols=members.map(m=>{
        if(e.paidBy===m) return `<td class="amt-paid">${fmt(e.amount||0,curId)}</td>`;
        if((e.splits||[]).includes(m)) return `<td class="amt-owed">-${fmt(per,curId)}</td>`;
        return `<td style="color:#ccc">—</td>`;
      }).join("");
      return `<tr><td><div class="row-title">${cat.emoji} ${e.desc}</div><div class="row-by">${e.paidBy} · ${ds}</div></td><td style="font-weight:600">${fmt(e.amount||0,curId)}</td>${cols}</tr>`;
    }).join("");
    const totCols=members.map(m=>{const n=net[m]||0;return `<td class="${n>=0?"amt-paid":"amt-owed"}">${n>=0?"+":""}${fmt(n,curId)}</td>`;}).join("");
    html+=`<div class="splid-wrap"><div class="splid-title">${curId} 帳單</div><div class="splid-scroll"><table class="splid-table"><thead><tr><th>項目</th><th>金額</th>${thCols}</tr></thead><tbody>${rows}<tr class="total-row"><td>合計 ${fmt(total,curId)}</td><td></td>${totCols}</tr></tbody></table></div></div>`;
  });
  html+=`<div class="s-label" style="margin-top:4px">Suggested Payments</div>`;
  let any=false;
  Object.entries(CURRENCIES).forEach(([curId])=>{
    const list=Object.values(expenses).filter(e=>e.currency===curId);
    if(!list.length) return;
    const paid={},owed={};
    members.forEach(m=>{paid[m]=0;owed[m]=0;});
    list.forEach(e=>{
      if(paid[e.paidBy]!==undefined) paid[e.paidBy]+=(e.amount||0);
      (e.splits||[]).forEach(m=>{if(owed[m]!==undefined) owed[m]+=(e.amount||0)/Math.max((e.splits||[]).length,1);});
    });
    const net={};members.forEach(m=>net[m]=(paid[m]||0)-(owed[m]||0));
    const cc=Object.entries(net).filter(([,v])=>v>0.005).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n,v}));
    const dd=Object.entries(net).filter(([,v])=>v<-0.005).sort((a,b)=>a[1]-b[1]).map(([n,v])=>({n,v:-v}));
    const ccc=cc.map(x=>({...x})),ddd=dd.map(x=>({...x}));
    let ci=0,di=0;
    while(ci<ccc.length&&di<ddd.length){
      const amt=Math.min(ccc[ci].v,ddd[di].v);
      if(amt>0.005){any=true;html+=`<div class="payment-card"><span style="font-size:20px">💸</span><span style="font-weight:700;color:var(--terra);font-size:14px">${ddd[di].n}</span><span style="color:var(--muted);font-size:12px;margin:0 4px">owes</span><span style="font-weight:700;color:var(--olive);font-size:14px">${ccc[ci].n}</span><span style="font-weight:700;color:var(--dark);font-size:15px;margin-left:auto">${fmt(amt,curId)}</span></div>`;}
      ccc[ci].v-=amt;ddd[di].v-=amt;
      if(ccc[ci].v<0.005)ci++;if(ddd[di].v<0.005)di++;
    }
  });
  if(!any) html+=`<div class="settled-box">🎉 帳目已結清！</div>`;
  c.innerHTML=html;
}

function renderCurManage(){
  const w=document.getElementById("cur-manage-chips");
  if(!w) return;
  w.innerHTML=Object.entries(CURRENCIES).map(([id,sym])=>`<div class="cur-chip">${sym} ${id}${id==="EUR"?"":` <button class="cur-chip-del" onclick="window.delCurrency('${id}')">×</button>`}</div>`).join("");
}

function renderCurChips(){document.getElementById("currency-chips").innerHTML=Object.entries(CURRENCIES).map(([id])=>`<button class="chip ${id===fCur?"on":"off"}" onclick="window.pickCur('${id}')" style="padding:7px 14px;font-size:12px">${id}</button>`).join("");}
function renderPayerChips(){document.getElementById("payer-chips").innerHTML=members.map(m=>`<button class="chip ${m===fPayer?"on":"off"}" onclick="window.pickPayer('${m}')">${m}</button>`).join("");}
function renderSplitChips(){document.getElementById("split-chips").innerHTML=members.map(m=>`<button class="chip ${fSplits[m]?"on":"off"}" onclick="window.togSplit('${m}')">${m}</button>`).join("");}

window.go=name=>{
  ["home","summary","settings"].forEach(s=>{
    document.getElementById("screen-"+s).classList.toggle("active",s===name);
    document.getElementById("nav-"+s).classList.toggle("active",s===name);
  });
  if(name==="summary") renderSummary();
  if(name==="settings") renderCurManage();
};

window.openSheet=(keepData=false)=>{
  if(!keepData){
    currentEditKey=null;
    document.getElementById("sheet-title").textContent="記一筆支出";
    document.getElementById("f-desc").value="";
    document.getElementById("f-amt").value="";
    fCur="EUR"; fPayer=members[0]||""; fCat="food";
    fSplits={}; members.forEach(m=>fSplits[m]=true);
  }
  buildCatGrid();
  renderCurChips(); renderPayerChips(); renderSplitChips();
  document.getElementById("add-overlay").classList.add("show");
};
window.closeSheet=()=>document.getElementById("add-overlay").classList.remove("show");

window.handleCardClick=key=>{
  if(!isEditing) return;
  const e=expenses[key]; if(!e) return;
  currentEditKey=key;
  document.getElementById("sheet-title").textContent="修改支出";
  document.getElementById("f-desc").value=e.desc||"";
  document.getElementById("f-amt").value=e.amount||"";
  fCur=e.currency||"EUR"; fPayer=e.paidBy||""; fCat=e.category||"food";
  fSplits={}; members.forEach(m=>fSplits[m]=(e.splits||[]).includes(m));
  window.openSheet(true);
};

window.submitExpense=()=>{
  const desc=document.getElementById("f-desc").value.trim();
  const amt=parseFloat(document.getElementById("f-amt").value);
  const sp=Object.keys(fSplits).filter(k=>fSplits[k]);
  if(!desc) return alert("請填寫說明");
  if(isNaN(amt)||amt<=0) return alert("請填寫有效金額");
  if(!sp.length) return alert("請選擇分擔人員");
  const data={desc,amount:amt,currency:fCur,paidBy:fPayer,splits:sp,category:fCat,ts:currentEditKey?expenses[currentEditKey].ts:Date.now()};
  if(currentEditKey) update(ref(db,_R+"/expenses/"+currentEditKey),data);
  else push(expRef,data);
  window.closeSheet();
};

window.handleEditToggle=()=>{
  if(!isEditing&&prompt("管理驗證：")!==_K.join("")) return alert("驗證失敗");
  isEditing=!isEditing;
  const btn=document.getElementById("edit-toggle-btn");
  btn.style.background=isEditing?"#2E1A0E":"var(--sandL)";
  btn.style.color=isEditing?"white":"var(--sea)";
  document.getElementById("lock-icon").textContent=isEditing?"🔓":"🔒";
  document.getElementById("btn-text").textContent=isEditing?"完成退出":"編輯管理";
  renderAll();
};

window.delExp=k=>confirm("確定刪除？")&&remove(ref(db,_R+"/expenses/"+k));
window.addMem=()=>{const n=prompt("輸入旅伴姓名");if(n&&!members.includes(n)){members.push(n);set(memRef,members);}};
window.delMem=n=>confirm(`刪除 ${n}？`)&&(members=members.filter(x=>x!==n),set(memRef,members),renderAll());
window.pickCur=id=>{fCur=id;renderCurChips();};
window.pickPayer=m=>{fPayer=m;renderPayerChips();};
window.togSplit=m=>{fSplits[m]=!fSplits[m];renderSplitChips();};

window.addCurrency=()=>{
  const inp=document.getElementById("new-cur-input");
  const id=inp.value.trim().toUpperCase();
  if(!id||id.length<2) return;
  if(CURRENCIES[id]){alert("幣別已存在");return;}
  CURRENCIES[id]=CUR_SYMBOLS[id]||id;
  set(curRef,CURRENCIES); inp.value=""; renderCurManage();
};
window.delCurrency=id=>{
  if(id==="EUR") return;
  if(!confirm(`刪除 ${id}？`)) return;
  delete CURRENCIES[id]; set(curRef,CURRENCIES); renderCurManage();
};

window.exportToCSV=()=>{
  const list=Object.values(expenses).sort((a,b)=>(a.ts||0)-(b.ts||0));
  if(!list.length) return alert("沒有資料");
  let csv="\uFEFF"+"Title,Amount,Currency,By,Date,"+members.join(",")+"\n";
  list.forEach(e=>{
    const per=(e.amount||0)/Math.max((e.splits||[]).length,1);
    const mVals=members.map(m=>{
      if(e.paidBy===m) return (e.amount||0).toFixed(2);
      if((e.splits||[]).includes(m)) return (-per).toFixed(2);
      return "";
    }).join(",");
    const ds=e.ts?new Date(e.ts).toLocaleDateString("zh-TW"):"";
    csv+=`"${(e.desc||"").replace(/"/g,'""')}",${(e.amount||0).toFixed(2)},${e.currency||""},${e.paidBy||""},${ds},${mVals}\n`;
  });
  csv+="\n";
  Object.keys(CURRENCIES).forEach(curId=>{
    const cl=list.filter(e=>e.currency===curId);
    if(!cl.length) return;
    const paid={},owed={};
    members.forEach(m=>{paid[m]=0;owed[m]=0;});
    cl.forEach(e=>{
      if(paid[e.paidBy]!==undefined) paid[e.paidBy]+=(e.amount||0);
      (e.splits||[]).forEach(m=>{if(owed[m]!==undefined) owed[m]+=(e.amount||0)/Math.max((e.splits||[]).length,1);});
    });
    csv+=`"${curId} 結算 (+=別人欠你)",,,,, ${members.map(m=>((paid[m]||0)-(owed[m]||0)).toFixed(2)).join(",")}\n`;
  });
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  a.download=`Sicilia_2026_${new Date().toLocaleDateString("zh-TW").replace(/\//g,"-")}.csv`;
  a.click();
};

// ── Firebase listeners ──
onValue(expRef,s=>{
  expenses=s.val()||{};
  renderAll();
  document.getElementById("loading-screen").style.display="none";
  document.getElementById("last-sync").textContent=new Date().toLocaleTimeString("zh-TW");
},err=>{
  console.error("Firebase error:",err);
  document.getElementById("loading-screen").style.display="none";
});
onValue(memRef,s=>{
  if(s.val()&&Array.isArray(s.val())&&s.val().length){
    members=s.val(); renderMembers();
    document.getElementById("s-mem").textContent=members.length;
  }
});
onValue(curRef,s=>{
  const d=s.val();
  if(d&&typeof d==="object"&&!Array.isArray(d)&&Object.keys(d).length){
    CURRENCIES=d;
  } else {
    set(curRef,{"EUR":"€","HKD":"HK$"});
  }
  renderCurManage();
});

setTimeout(()=>{ document.getElementById("loading-screen").style.display="none"; },8000);
</script>
