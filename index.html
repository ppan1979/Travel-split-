<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
<title>Sicilia 2026 🌊</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,400;1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --terra:#C4622D;--terraD:#9E4B1F;--sand:#EAD8B5;--sandL:#F5EDDA;
  --cream:#FAF5EC;--dark:#2E1A0E;--olive:#6B7E4A;--sea:#3D7A8A;
  --white:#FFFFFF;--muted:#8E8271;--border:#E8E2D9;
  --serif:'Cormorant Garamond',serif;--sans:'DM Sans',sans-serif;
  --shadow:0 4px 12px rgba(46,26,14,0.06);
}
body{font-family:var(--sans);background:var(--cream);min-height:100vh;max-width:430px;margin:0 auto;color:var(--dark);padding-bottom:100px;-webkit-font-smoothing:antialiased}

/* Map banner */
.map-banner{width:100%;height:180px;position:relative;overflow:hidden;background:var(–terraD)}
.map-img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;filter:saturate(.8) brightness(.85)}
.map-overlay{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(46,26,14,0) 0%,rgba(46,26,14,.6) 100%);pointer-events:none}
.map-label{position:absolute;bottom:20px;left:20px;right:20px}
.map-eyebrow{font-family:var(–serif);font-style:italic;color:rgba(255,255,255,.85);font-size:14px;letter-spacing:4px;text-transform:uppercase;margin-bottom:4px}
.map-title{font-family:var(–serif);font-weight:600;color:#fff;font-size:32px;line-height:1;text-shadow:0 2px 12px rgba(0,0,0,.4)}

/* Nav */
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-top:1px solid var(–border);display:flex;padding:10px 0 24px;z-index:50}
.nav-btn{flex:1;background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(–sans);font-size:11px;font-weight:500;color:var(–muted);transition:all .3s}
.nav-btn.active{color:var(–terra)}
.nav-icon{font-size:22px;margin-bottom:2px}

/* FAB */
.fab{position:fixed;bottom:90px;right:20px;width:60px;height:60px;border-radius:50%;background:linear-gradient(135deg,var(–terra),var(–terraD));color:#fff;font-size:32px;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 24px rgba(196,98,45,.4);cursor:pointer;border:none;z-index:40;transition:all .2s}

/* Body */
.body{padding:20px 18px}
.s-label{font-family:var(–serif);font-weight:600;font-size:20px;color:var(–dark);margin:12px 0 16px;display:flex;justify-content:space-between;align-items:center}
.s-action{font-family:var(–sans);font-size:12px;color:var(–sea);cursor:pointer;font-weight:700;background:var(–sandL);padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:4px}

/* Chips */
.chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
.chip{border-radius:12px;padding:8px 16px;font-size:13px;cursor:pointer;border:1px solid transparent;transition:all .2s;font-family:var(–sans);font-weight:500}
.chip.on{background:var(–terra);color:#fff}
.chip.off{background:#fff;color:var(–dark);border-color:var(–border)}

/* Expense cards */
.card{background:#fff;border-radius:18px;padding:16px;margin-bottom:12px;box-shadow:var(–shadow);display:flex;gap:14px;align-items:center;position:relative;overflow:hidden;transition:.2s}
.card.editing{border:1px dashed var(–terra);cursor:pointer}
.card-icon{width:44px;height:44px;border-radius:14px;background:var(–sandL);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.card-del-btn{background:#e74c3c;color:#fff;border:none;border-radius:10px;padding:8px 12px;font-size:12px;font-weight:700;display:none;z-index:10;cursor:pointer}
.card.editing .card-del-btn{display:block}

/* ── Splid-style summary table ── */
.splid-wrap{background:#fff;border-radius:18px;overflow:hidden;box-shadow:var(–shadow);margin-bottom:20px}
.splid-title{font-family:var(–serif);font-size:17px;font-weight:600;color:var(–dark);padding:16px 16px 8px;border-bottom:1px solid var(–sandL)}
.splid-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.splid-table{width:100%;border-collapse:collapse;font-size:12px;min-width:300px}
.splid-table th{background:var(–sandL);color:var(–muted);font-weight:700;font-size:10px;letter-spacing:.8px;text-transform:uppercase;padding:8px 12px;text-align:right;white-space:nowrap}
.splid-table th:first-child{text-align:left}
.splid-table td{padding:10px 12px;border-bottom:1px solid var(–sandL);vertical-align:middle;text-align:right}
.splid-table td:first-child{text-align:left}
.splid-table tr:last-child td{border-bottom:none}
.row-title{font-weight:600;color:var(–dark);font-size:12px;max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-by{font-size:10px;color:var(–muted);margin-top:2px}
.amt-paid{color:var(–olive);font-weight:700}
.amt-owed{color:var(–terra);font-weight:600}
.total-row td{font-weight:700;font-size:13px;background:var(–sandL)}

/* Suggested payments */
.payment-card{background:#fff;border-radius:14px;padding:14px 16px;margin-bottom:8px;box-shadow:var(–shadow);display:flex;align-items:center;gap:10px}
.settled-box{text-align:center;padding:28px;color:var(–muted);font-size:14px}

/* Sheet overlay */
.overlay{position:fixed;inset:0;background:rgba(46,26,14,.6);backdrop-filter:blur(4px);z-index:60;display:flex;flex-direction:column;justify-content:flex-end;opacity:0;pointer-events:none;transition:all .3s}
.overlay.show{opacity:1;pointer-events:auto}
.sheet{background:var(–cream);border-radius:24px 24px 0 0;padding:24px 20px 40px;max-height:95vh;overflow-y:auto;transform:translateY(100%);transition:transform .4s cubic-bezier(.4,0,.2,1)}
.overlay.show .sheet{transform:translateY(0)}
.sheet-title-text{text-align:center;font-family:var(–serif);font-size:22px;font-weight:600;margin-bottom:20px;color:var(–dark)}

/* ── Category grid ── */
.cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.cat-btn{padding:0;border-radius:18px;cursor:pointer;border:2.5px solid transparent;background:#fff;display:flex;flex-direction:column;align-items:center;gap:0;transition:all .2s;font-family:var(–sans);font-size:12px;font-weight:600;color:var(–dark);overflow:hidden;box-shadow:0 2px 8px rgba(46,26,14,.07)}
.cat-btn .cat-emoji-wrap{width:100%;padding:16px 8px 10px;display:flex;align-items:center;justify-content:center;font-size:36px;line-height:1;transition:background .2s}
.cat-btn .cat-label{padding:0 6px 12px;font-size:12px;font-weight:600;transition:color .2s}
.cat-btn[data-id=“food”] .cat-emoji-wrap{background:#FFF0E4}
.cat-btn[data-id=“car”]  .cat-emoji-wrap{background:#E4F0FF}
.cat-btn[data-id=“hotel”] .cat-emoji-wrap{background:#FFF8E4}
.cat-btn[data-id=“ticket”] .cat-emoji-wrap{background:#F0E4FF}
.cat-btn[data-id=“shop”] .cat-emoji-wrap{background:#FFE4F0}
.cat-btn[data-id=“other”] .cat-emoji-wrap{background:#E4FFF0}
.cat-btn.on{border-color:var(–terra);box-shadow:0 4px 16px rgba(196,98,45,.30)}
.cat-btn.on .cat-emoji-wrap{background:var(–terra)}
.cat-btn.on .cat-label{color:var(–terra)}

/* Form inputs */
.f-label{font-size:11px;color:var(–muted);letter-spacing:1px;text-transform:uppercase;margin:16px 0 8px;display:block;font-weight:700}
.f-input{width:100%;padding:14px 16px;border-radius:14px;border:1.5px solid var(–border);background:#fff;font-size:17px;outline:none;font-family:var(–sans);transition:border-color .2s}
.f-input:focus{border-color:var(–terra)}
.sub-btn{width:100%;padding:17px;border-radius:16px;background:var(–terra);color:#fff;font-weight:700;font-size:16px;border:none;margin-top:24px;cursor:pointer;font-family:var(–serif);font-style:italic;font-size:19px;letter-spacing:.5px}
.cancel-btn{width:100%;padding:12px;border-radius:16px;background:transparent;color:var(–muted);font-size:14px;border:none;cursor:pointer;margin-top:6px;font-family:var(–sans)}

/* Currency management */
.cur-chip-wrap{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.cur-chip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(–border);border-radius:10px;padding:6px 12px;font-size:13px;font-weight:600}
.cur-chip-del{background:none;border:none;color:#ccc;cursor:pointer;font-size:16px;padding:0;line-height:1}
.cur-chip-del:hover{color:#e74c3c}
.cur-add-row{display:flex;gap:8px}
.cur-add-row input{flex:1;padding:10px 14px;border-radius:12px;border:1px solid var(–border);font-size:14px;outline:none;background:#fff;font-family:var(–sans)}
.cur-add-btn{padding:10px 16px;border-radius:12px;background:var(–sea);color:#fff;border:none;font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap}

.screen{display:none}.screen.active{display:block}
</style>

</head>
<body>

<div id="loading-screen" style="position:fixed;inset:0;background:var(--cream);display:flex;align-items:center;justify-content:center;z-index:100;flex-direction:column;gap:15px">
  <div style="font-size:50px">🌋</div>
  <div style="font-family:var(--serif);font-style:italic;font-size:18px;color:var(--terra)">Syncing Ledger...</div>
</div>

<div class="map-banner">
  <img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?q=80&w=1200" class="map-img"/>
  <div class="map-overlay"></div>
  <div class="map-label">
    <div class="map-eyebrow">Travel Ledger 2026</div>
    <div class="map-title">Sicilia 🌊</div>
  </div>
</div>

<!-- HOME -->

<div id="screen-home" class="screen active body">
  <div class="s-label">旅伴與明細
    <span class="s-action" id="edit-toggle-btn" onclick="handleEditToggle()">
      <span id="lock-icon">🔒</span> <span id="btn-text">編輯管理</span>
    </span>
  </div>
  <div class="chip-wrap" id="member-chips"></div>
  <div id="expense-list"></div>
</div>

<!-- SUMMARY -->

<div id="screen-summary" class="screen body">
  <div id="summary-content"></div>
</div>

<!-- SETTINGS -->

<div id="screen-settings" class="screen body">
  <div class="s-label">幣別管理</div>
  <div style="background:#fff;padding:16px;border-radius:18px;box-shadow:var(--shadow);margin-bottom:20px">
    <div style="font-size:12px;color:var(--muted);margin-bottom:12px">目前支援幣別（EUR 不可刪除）</div>
    <div class="cur-chip-wrap" id="cur-manage-chips"></div>
    <div class="cur-add-row">
      <input type="text" id="new-cur-input" placeholder="輸入幣別代碼，如 JPY" maxlength="5" style="text-transform:uppercase"/>

    </div>
  </div>
  <div class="s-label">帳本設定</div>
  <div style="background:#fff;padding:20px;border-radius:18px;box-shadow:var(--shadow);font-size:13px;color:var(--muted);margin-bottom:16px">
    密碼保護已啟動。進入編輯模式可修正金額或類別。<br><br>
    上次更新：<span id="last-sync">—</span>
  </div>
  <button class="sub-btn" style="background:var(--sea);font-style:normal;font-family:var(--sans)" onclick="window.exportToCSV()">📊 匯出 CSV 報表</button>
</div>

<!-- ADD / EDIT SHEET -->

<div class="overlay" id="add-overlay" onclick="if(event.target.id==='add-overlay')window.closeSheet()">
  <div class="sheet">
    <div class="sheet-title-text" id="sheet-title">記一筆支出</div>
    <div class="cat-grid" id="cat-grid"></div>
    <label class="f-label">支出說明</label>
    <input type="text" id="f-desc" class="f-input" placeholder="例：阿格里真托神殿門票"/>
    <label class="f-label">金額</label>
    <div style="display:flex;gap:8px;align-items:center">
      <div class="chip-wrap" id="currency-chips" style="margin-bottom:0;flex-wrap:nowrap"></div>
      <input type="number" id="f-amt" class="f-input" inputmode="decimal" placeholder="0.00" style="flex:1;margin-bottom:0"/>
    </div>
    <label class="f-label">誰墊付</label>
    <div class="chip-wrap" id="payer-chips"></div>
    <label class="f-label">分擔人員（可複選）</label>
    <div class="chip-wrap" id="split-chips"></div>
    <button class="sub-btn" onclick="window.submitExpense()">儲存支出</button>
    <button class="cancel-btn" onclick="window.closeSheet()">取消</button>
  </div>
</div>

<button class="fab" id="fab-btn" onclick="window.openSheet()">+</button>

<div class="nav">
  <button class="nav-btn active" id="nav-home" onclick="window.go('home')"><span class="nav-icon">🧾</span>明細</button>
  <button class="nav-btn" id="nav-summary" onclick="window.go('summary')"><span class="nav-icon">⚖️</span>結算</button>
  <button class="nav-btn" id="nav-settings" onclick="window.go('settings')"><span class="nav-icon">⚙️</span>設定</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, push, remove, onValue, set, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const _K=[1,9,7,9], _R="sicilia2026";
const config={apiKey:"AIzaSyBF5DMs4bTOC-8IvN0LthZGSkLVWhA25sY",authDomain:"travel-sync-57594.firebaseapp.com",databaseURL:"https://travel-sync-57594-default-rtdb.firebaseio.com",projectId:"travel-sync-57594",storageBucket:"travel-sync-57594.firebasestorage.app",messagingSenderId:"1025511821264",appId:"1:1025511821264:web:9fde66b9a08400fd6f33d5"};
const app=initializeApp(config);
const db=getDatabase(app);
const expRef=ref(db,_R+"/expenses"), memRef=ref(db,_R+"/members"), curRef=ref(db,_R+"/currencies");

const CATS=[{id:"food",label:"餐飲",emoji:"🍝"},{id:"car",label:"交通",emoji:"🚗"},{id:"hotel",label:"住宿",emoji:"🏨"},{id:"ticket",label:"景點",emoji:"🎟"},{id:"shop",label:"購物",emoji:"🛍"},{id:"other",label:"其他",emoji:"📌"}];
// Known symbols for auto-fill
const CUR_SYMBOLS={"EUR":"€","TWD":"NT$","USD":"$","HKD":"HK$","JPY":"¥","GBP":"£","AUD":"A$","SGD":"S$","CHF":"Fr","KRW":"₩"};
// CURRENCIES is stored as plain object to avoid Firebase array bug: {EUR:"€", HKD:"HK$"}
let CURRENCIES={"EUR":"€","HKD":"HK$"};
let expenses={}, members=["Pauline","Daniel"], isEditing=false, currentEditKey=null;
let fCat="food", fPayer="", fSplits={}, fCur="EUR";

// Format amount with symbol from CURRENCIES object
const fmt=(n,curId)=>{
  const sym=CURRENCIES[curId]||curId||"€";
  return (n<0?"-":"")+sym+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
};

function renderAll(){
  renderMembers();
  renderExpenses();
  if(document.getElementById("screen-summary").classList.contains("active")) renderSummary();
}

function renderMembers(){
  const w=document.getElementById("member-chips");
  w.innerHTML=members.map(m=>`<div class="chip on">${m}${isEditing?`<span onclick="window.delMem('${m}')" style="margin-left:8px;opacity:.5;cursor:pointer">×</span>`:""}</div>`).join("");
  if(isEditing) w.innerHTML+=`<button class="chip off" onclick="window.addMem()">+ 新旅伴</button>`;
}

function renderExpenses(){
  const el=document.getElementById("expense-list");
  const list=Object.entries(expenses).sort((a,b)=>b[1].ts-a[1].ts);
  if(!list.length){el.innerHTML="<div style='text-align:center;padding:40px;color:#aaa'>尚無支出明細</div>";return;}
  el.innerHTML=list.map(([k,e])=>{
    const c=CATS.find(x=>x.id===e.category)||CATS[5];
    return `<div class="card ${isEditing?"editing":""}" onclick="window.handleCardClick('${k}')">
      <div class="card-icon">${c.emoji}</div>
      <div style="flex:1">
        <div style="font-weight:700">${e.desc}</div>
        <div style="font-size:11px;color:var(--muted)">${e.paidBy} 墊付 · ${(e.splits||[]).length}人分擔</div>
        <div style="color:var(--terra);font-weight:700;margin-top:4px">${fmt(e.amount,e.currency)}</div>
      </div>
      <button class="card-del-btn" onclick="event.stopPropagation();window.delExp('${k}')">刪除</button>
    </div>`;
  }).join("");
}

function renderSummary(){
  const container=document.getElementById("summary-content");
  let html="";
  const curEntries=Object.entries(CURRENCIES); // [[id,symbol],...]

  curEntries.forEach(([curId,curSym])=>{
    const list=Object.values(expenses).filter(e=>e.currency===curId);
    if(!list.length) return;

    const paid={},owed={};
    members.forEach(m=>{paid[m]=0;owed[m]=0;});
    list.forEach(e=>{
      if(paid[e.paidBy]!==undefined) paid[e.paidBy]+=(e.amount||0);
      (e.splits||[]).forEach(m=>{if(owed[m]!==undefined) owed[m]+=(e.amount||0)/Math.max((e.splits||[]).length,1);});
    });
    const net={};members.forEach(m=>net[m]=(paid[m]||0)-(owed[m]||0));
    const totalAmt=list.reduce((s,e)=>s+(e.amount||0),0);

    const thCols=members.map(m=>`<th>${m}</th>`).join("");
    const rows=list.sort((a,b)=>(a.ts||0)-(b.ts||0)).map(e=>{
      const cat=CATS.find(x=>x.id===e.category)||CATS[5];
      const per=(e.amount||0)/Math.max((e.splits||[]).length,1);
      const dCols=members.map(m=>{
        if(e.paidBy===m) return `<td class="amt-paid">${fmt(e.amount,curId)}</td>`;
        if((e.splits||[]).includes(m)) return `<td class="amt-owed">-${fmt(per,curId)}</td>`;
        return `<td style="color:#ddd">—</td>`;
      }).join("");
      const ds=e.ts?new Date(e.ts).toLocaleDateString("zh-TW",{month:"numeric",day:"numeric"}):"";
      return `<tr><td><div class="row-title">${cat.emoji} ${e.desc}</div><div class="row-by">${e.paidBy} · ${ds}</div></td><td style="font-weight:600">${fmt(e.amount,curId)}</td>${dCols}</tr>`;
    }).join("");

    const totalCols=members.map(m=>{
      const n=net[m]||0;
      return `<td class="${n>=0?"amt-paid":"amt-owed"}">${n>=0?"+":""}${fmt(n,curId)}</td>`;
    }).join("");

    html+=`<div class="splid-wrap">
      <div class="splid-title">${curId} 帳單</div>
      <div class="splid-scroll"><table class="splid-table">
        <thead><tr><th>項目</th><th>金額</th>${thCols}</tr></thead>
        <tbody>${rows}<tr class="total-row"><td>合計 ${fmt(totalAmt,curId)}</td><td></td>${totalCols}</tr></tbody>
      </table></div>
    </div>`;
  });

  // Suggested payments
  html+=`<div class="s-label" style="margin-top:4px">Suggested Payments</div>`;
  let hasAny=false;
  curEntries.forEach(([curId])=>{
    const list=Object.values(expenses).filter(e=>e.currency===curId);
    if(!list.length) return;
    const paid={},owed={};
    members.forEach(m=>{paid[m]=0;owed[m]=0;});
    list.forEach(e=>{
      if(paid[e.paidBy]!==undefined) paid[e.paidBy]+=(e.amount||0);
      (e.splits||[]).forEach(m=>{if(owed[m]!==undefined) owed[m]+=(e.amount||0)/Math.max((e.splits||[]).length,1);});
    });
    const net={};members.forEach(m=>net[m]=(paid[m]||0)-(owed[m]||0));
    const cc=Object.entries(net).filter(([,v])=>v>0.005).sort((a,b)=>b[1]-a[1]).map(([n,v])=>({n,v}));
    const dd=Object.entries(net).filter(([,v])=>v<-0.005).sort((a,b)=>a[1]-b[1]).map(([n,v])=>({n,v:-v}));
    const ccc=cc.map(x=>({...x})),ddd=dd.map(x=>({...x}));
    let ci=0,di=0;
    while(ci<ccc.length&&di<ddd.length){
      const amt=Math.min(ccc[ci].v,ddd[di].v);
      if(amt>0.005){
        hasAny=true;
        html+=`<div class="payment-card"><span style="font-size:20px">💸</span>
          <span style="font-weight:700;color:var(--terra);font-size:14px">${ddd[di].n}</span>
          <span style="color:var(--muted);font-size:12px">owes</span>
          <span style="font-weight:700;color:var(--olive);font-size:14px">${ccc[ci].n}</span>
          <span style="font-weight:700;color:var(--dark);font-size:15px;margin-left:auto">${fmt(amt,curId)}</span>
        </div>`;
      }
      ccc[ci].v-=amt;ddd[di].v-=amt;
      if(ccc[ci].v<0.005)ci++;if(ddd[di].v<0.005)di++;
    }
  });
  if(!hasAny) html+=`<div class="settled-box">🎉 帳目已結清！</div>`;
  container.innerHTML=html;
}

// Currency management
function renderCurManage(){
  const wrap=document.getElementById("cur-manage-chips");
  if(!wrap) return;
  wrap.innerHTML=Object.entries(CURRENCIES).map(([id,sym])=>`
    <div class="cur-chip">${sym} ${id}
      ${id==="EUR"?"":` <button class="cur-chip-del" onclick="window.delCurrency('${id}')">×</button>`}
    </div>`).join("");
}
window.addCurrency=()=>{
  const inp=document.getElementById("new-cur-input");
  const id=inp.value.trim().toUpperCase();
  if(!id||id.length<2) return;
  if(CURRENCIES[id]){alert("幣別已存在");return;}
  CURRENCIES[id]=CUR_SYMBOLS[id]||id;
  set(curRef,CURRENCIES);
  inp.value="";
  renderCurManage();
};
window.delCurrency=id=>{
  if(id==="EUR") return;
  if(!confirm(`刪除 ${id}？`)) return;
  delete CURRENCIES[id];
  set(curRef,CURRENCIES);
  renderCurManage();
};

// Nav
window.go=name=>{
  ["home","summary","settings"].forEach(s=>{
    document.getElementById("screen-"+s).classList.toggle("active",s===name);
    document.getElementById("nav-"+s).classList.toggle("active",s===name);
  });
  if(name==="summary") renderSummary();
  if(name==="settings") renderCurManage();
};

// Sheet
window.handleCardClick=key=>{
  if(!isEditing) return;
  const e=expenses[key]; currentEditKey=key;
  document.getElementById("sheet-title").textContent="修改支出";
  document.getElementById("f-desc").value=e.desc;
  document.getElementById("f-amt").value=e.amount;
  fCur=e.currency; fPayer=e.paidBy; fCat=e.category;
  fSplits={}; members.forEach(m=>fSplits[m]=(e.splits||[]).includes(m));
  window.openSheet(true);
};
window.openSheet=(keepData=false)=>{
  if(!keepData){
    currentEditKey=null;
    document.getElementById("sheet-title").textContent="記一筆支出";
    document.getElementById("f-desc").value="";
    document.getElementById("f-amt").value="";
    fCur="EUR"; fPayer=members[0]; fCat="food";
    fSplits={}; members.forEach(m=>fSplits[m]=true);
  }
  document.getElementById("cat-grid").innerHTML=CATS.map(c=>`<button class="cat-btn ${c.id===fCat?"on":"off"}" data-id="${c.id}" onclick="window.pickCat('${c.id}')"><span class="cat-emoji-wrap">${c.emoji}</span><span class="cat-label">${c.label}</span></button>`).join("");
  renderCurChips(); renderPayerChips(); renderSplitChips();
  document.getElementById("add-overlay").classList.add("show");
};
window.closeSheet=()=>document.getElementById("add-overlay").classList.remove("show");
window.submitExpense=()=>{
  const desc=document.getElementById("f-desc").value.trim();
  const amt=parseFloat(document.getElementById("f-amt").value);
  const sp=Object.keys(fSplits).filter(k=>fSplits[k]);
  if(!desc||isNaN(amt)||!sp.length) return alert("請填寫說明與金額");
  const data={desc,amount:amt,currency:fCur,paidBy:fPayer,splits:sp,category:fCat,ts:currentEditKey?expenses[currentEditKey].ts:Date.now()};
  if(currentEditKey) update(ref(db,_R+"/expenses/"+currentEditKey),data);
  else push(expRef,data);
  window.closeSheet();
};
window.handleEditToggle=()=>{
  if(!isEditing&&prompt("管理驗證：")!==_K.join("")) return alert("驗證失敗");
  isEditing=!isEditing;
  const btn=document.getElementById("edit-toggle-btn");
  btn.style.background=isEditing?"var(--dark)":"var(--sandL)";
  btn.style.color=isEditing?"white":"var(--sea)";
  document.getElementById("lock-icon").textContent=isEditing?"🔓":"🔒";
  document.getElementById("btn-text").textContent=isEditing?"完成退出":"編輯管理";
  renderAll();
};
window.delExp=k=>confirm("確定刪除？")&&remove(ref(db,_R+"/expenses/"+k));
window.addMem=()=>{const n=prompt("輸入旅伴姓名");if(n){members.push(n);set(memRef,members);}};
window.delMem=n=>confirm(`刪除 ${n}？`)&&(members=members.filter(x=>x!==n),set(memRef,members));
window.pickCur=id=>{fCur=id;renderCurChips();};
window.pickPayer=m=>{fPayer=m;renderPayerChips();};
window.togSplit=m=>{fSplits[m]=!fSplits[m];renderSplitChips();};
window.pickCat=id=>{fCat=id;document.querySelectorAll(".cat-btn").forEach(b=>{const isOn=b.dataset.id===id;b.className="cat-btn "+(isOn?"on":"off");});};
function renderCurChips(){document.getElementById("currency-chips").innerHTML=Object.entries(CURRENCIES).map(([id])=>`<button class="chip ${id===fCur?"on":"off"}" onclick="window.pickCur('${id}')">${id}</button>`).join("");}
function renderPayerChips(){document.getElementById("payer-chips").innerHTML=members.map(m=>`<button class="chip ${m===fPayer?"on":"off"}" onclick="window.pickPayer('${m}')">${m}</button>`).join("");}
function renderSplitChips(){document.getElementById("split-chips").innerHTML=members.map(m=>`<button class="chip ${fSplits[m]?"on":"off"}" onclick="window.togSplit('${m}')">${m}</button>`).join("");}

// CSV export (Splid-style: per-member columns)
window.exportToCSV=()=>{
  const list=Object.values(expenses).sort((a,b)=>a.ts-b.ts);
  if(!list.length) return alert("沒有資料");
  const BOM="\uFEFF";
  let csv=BOM+`Title,Amount,Currency,By,Date,${members.join(",")}\n`;
  list.forEach(e=>{
    const per=(e.amount||0)/Math.max((e.splits||[]).length,1);
    const mVals=members.map(m=>{
      if(e.paidBy===m) return e.amount.toFixed(2);
      if((e.splits||[]).includes(m)) return (-per).toFixed(2);
      return "";
    }).join(",");
    const ds=e.ts?new Date(e.ts).toLocaleDateString("zh-TW"):"";
    csv+=`"${(e.desc||"").replace(/"/g,'""')}",${(e.amount||0).toFixed(2)},${e.currency},${e.paidBy},${ds},${mVals}\n`;
  });
  csv+="\n";
  Object.keys(CURRENCIES).forEach(curId=>{
    const curList=list.filter(e=>e.currency===curId);
    if(!curList.length) return;
    const paid={},owed={};
    members.forEach(m=>{paid[m]=0;owed[m]=0;});
    curList.forEach(e=>{
      if(paid[e.paidBy]!==undefined) paid[e.paidBy]+=(e.amount||0);
      (e.splits||[]).forEach(m=>{if(owed[m]!==undefined) owed[m]+=(e.amount||0)/Math.max((e.splits||[]).length,1);});
    });
    const nVals=members.map(m=>((paid[m]||0)-(owed[m]||0)).toFixed(2)).join(",");
    csv+=`"${curId} 結算 (+=別人欠你)",,,,, ${nVals}\n`;
  });
  const link=document.createElement("a");
  link.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8;"}));
  link.download=`Sicilia_2026_${new Date().toLocaleDateString("zh-TW").replace(/\//g,"-")}.csv`;
  link.click();
};

// Firebase listeners
onValue(expRef,s=>{
  expenses=s.val()||{};
  renderAll();
  document.getElementById("loading-screen").style.display="none";
  document.getElementById("last-sync").textContent=new Date().toLocaleTimeString();
},err=>{
  console.error(err);
  document.getElementById("loading-screen").style.display="none";
});
onValue(memRef,s=>{if(s.val()){members=s.val();renderMembers();}});
onValue(curRef,s=>{
  const d=s.val();
  if(d&&typeof d==="object"&&!Array.isArray(d)){
    CURRENCIES=d; // plain object {EUR:"€",...}
  } else {
    set(curRef,CURRENCIES); // first time init
  }
  renderCurManage();
  if(document.getElementById("screen-summary").classList.contains("active")) renderSummary();
});

// Fallback timeout
setTimeout(()=>{document.getElementById("loading-screen").style.display="none";},8000);
</script>
